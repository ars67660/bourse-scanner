name: Portefeuille virtuel automatique

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: virtual-portfolio-cycle
  cancel-in-progress: false

jobs:
  virtual-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Exécuter un cycle simulé
        env:
          VP_MAX_POSITIONS: "50"
          VP_MIN_SCORE: "65"
          VP_RISK_PCT: "1.0"
          VP_PERIOD: "1y"
          VP_INTERVAL: "1d"
          VP_TIMEFRAME_LABEL: "1 jour"
        run: python virtual_portfolio_worker.py

      - name: Enregistrer le portefeuille mis à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add portefeuille_virtuel.json
          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
          else
            git commit -m "Mise à jour automatique du portefeuille virtuel"
            git push
          fi
